# Render terminates HTTPS and forwards HTTP to the container.
lecook.cloud=true
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.datasource.hikari.maximum-pool-size=3
# Public Auth URL for the production branch; NEON_AUTH_BASE_URL can override it.
lecook.auth-base-url=https://ep-nameless-boat-b51ge9rl.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth
