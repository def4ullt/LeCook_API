spring.application.name=backend
spring.config.import=optional:file:./local-db.properties,optional:file:./backend/local-db.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/LeCook
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Server-side uploads only. Neon credentials are never bundled into Android.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
server.port=${PORT:8080}
